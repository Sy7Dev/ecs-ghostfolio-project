
name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY to confirm infrastructure deletion'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ghostfolio-terraform-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: true

jobs:
  terraform-destroy:
    name: Destroy AWS infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Verify destruction confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DESTROY" ]; then
            echo "Confirmation failed. You must type DESTROY."
            exit 1
          fi

          echo "Destruction confirmed."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform initialise
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
        env:
          TF_VAR_postgres_password: ${{ secrets.TF_VAR_postgres_password }}
          TF_VAR_jwt_secret_key: ${{ secrets.TF_VAR_jwt_secret_key }}
          TF_VAR_access_token_salt: ${{ secrets.TF_VAR_access_token_salt }}
